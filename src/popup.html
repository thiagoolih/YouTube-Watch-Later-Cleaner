<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="32" height="32">
    <div>
      <h1 data-i18n="popupTitle"></h1>
      <span id="version"></span>
    </div>
  </header>

  <button class="action danger" id="clean">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/></svg>
    <span>
      <strong data-i18n="btnClean"></strong>
      <small data-i18n="btnCleanHint"></small>
    </span>
  </button>

  <button class="action" id="restore">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6.5 12 11V8a6 6 0 1 1-6 6H4a8 8 0 1 0 8-9z"/></svg>
    <span>
      <strong data-i18n="btnRestore"></strong>
      <small data-i18n="btnRestoreHint"></small>
    </span>
  </button>

  <p id="status" role="status"></p>
  <footer data-i18n="disclaimer"></footer>

  <script src="popup.js"></script>
</body>
</html>
